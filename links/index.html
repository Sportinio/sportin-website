<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SportIn &middot; Links</title>
<meta name="description" content="All things SportIn in one place. League of Brands, the web app, and the SportIn app for iOS and Android." />
<meta name="theme-color" content="#0751FB" />
<meta name="color-scheme" content="dark" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="SportIn" />
<meta property="og:title" content="SportIn &middot; Links" />
<meta property="og:description" content="League of Brands, the web app, and the SportIn app for iOS and Android. All in one place." />
<meta property="og:url" content="https://sportin.io/links" />
<meta property="og:image" content="https://sportin.io/hero-banner.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-0: #06060C;
    --ink-1: #0A0A12;
    --ink-2: #111119;
    --ink-3: #1A1A26;
    --surface: rgba(255, 255, 255, 0.04);
    --surface-2: rgba(255, 255, 255, 0.07);
    --border: rgba(255, 255, 255, 0.1);
    --border-strong: rgba(255, 255, 255, 0.2);
    --text: #FFFFFF;
    --text-2: #C8CAD4;
    --text-3: #9AA0B4;
    --text-4: #5F667E;
    --blue: #0751FB;
    --blue-bright: #3B7BFF;
    --blue-glow: rgba(7, 81, 251, 0.4);
    --blue-light: #4D8AFF;
    --gold: #F5E4A8;
    --green: #12E094;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; background: #06060C; }
  html, body {
    color: var(--text);
    font-family: 'Geist', 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body { background: transparent; }
  a { text-decoration: none; color: inherit; }

  /* Mesh dot-grid canvas (same as home page) */
  #meshCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  /* Layout */
  .lt {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 56px 22px 40px;
    max-width: 480px;
    margin: 0 auto;
  }

  /* Profile */
  .profile { text-align: center; }
  .profile-logo {
    display: inline-block;
    animation: pop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  .profile-logo svg { width: 162px; height: auto; display: block; }

  /* Link stack */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .lt-btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 18px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(18px) saturate(1.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 10px 30px rgba(0, 0, 0, 0.28);
    transition: transform 0.18s ease, border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    opacity: 0;
    transform: translateY(16px);
    animation: rise 0.55s ease forwards;
  }
  .lt-btn:hover {
    transform: translateY(-3px);
    border-color: rgba(255, 255, 255, 0.22);
    background: rgba(255, 255, 255, 0.07);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 18px 44px rgba(0, 0, 0, 0.4);
  }
  .lt-ico {
    flex-shrink: 0;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--text);
  }
  .lt-ico svg { width: 22px; height: 22px; }
  .lt-text { flex: 1; min-width: 0; }
  .lt-label {
    display: block;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.01em;
    color: var(--text);
  }
  .lt-sub {
    display: block;
    font-size: 12px;
    color: var(--text-4);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .lt-arrow {
    flex-shrink: 0;
    color: var(--text-4);
    transition: transform 0.2s ease, color 0.2s ease;
  }
  .lt-btn:hover .lt-arrow { transform: translateX(3px); color: var(--text-2); }

  /* Featured primary button (League of Brands) */
  .lt-btn.primary {
    background: linear-gradient(135deg, #0B57FF 0%, #0751FB 60%, #053AC4 100%);
    border-color: rgba(255, 255, 255, 0.18);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 10px 30px rgba(0, 0, 0, 0.3);
  }
  .lt-btn.primary:hover {
    background: linear-gradient(135deg, #1f67ff 0%, #0B57FF 60%, #0843D6 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 18px 44px rgba(0, 0, 0, 0.42);
  }
  .lt-btn.primary .lt-ico {
    background: rgba(255, 255, 255, 0.16);
    border-color: rgba(255, 255, 255, 0.25);
    color: var(--gold);
  }
  .lt-btn.primary .lt-sub { color: rgba(255, 255, 255, 0.72); }
  .lt-btn.primary .lt-arrow { color: rgba(255, 255, 255, 0.8); }

  /* Stagger */
  .lt-btn:nth-child(1) { animation-delay: 0.10s; }
  .lt-btn:nth-child(2) { animation-delay: 0.18s; }
  .lt-btn:nth-child(3) { animation-delay: 0.26s; }
  .lt-btn:nth-child(4) { animation-delay: 0.34s; }

  /* Footer */
  .lt-footer {
    text-align: center;
    margin-top: 6px;
  }
  .lt-footer a {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-4);
    transition: color 0.2s ease;
  }
  .lt-footer a:hover { color: var(--text-2); }
  .lt-copy {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-4);
    margin-top: 10px;
    opacity: 0.7;
  }

  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .lt-btn, .profile-badge { animation: none; opacity: 1; transform: none; }
  }
  @media (max-width: 380px) {
    .lt-sub { white-space: normal; }
    .profile-name { font-size: 30px; }
  }
</style>
</head>
