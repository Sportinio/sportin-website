<!doctype html>
<!--
  card-t10 — "Map watermark" share card, static HTML port.
  Ports (rork-sportin-io, origin/testing-ios):
    ios/SportInIo/Views/Share/ShareCardTemplate10.swift          (layers, map zone + masks, scrim)
    ios/SportInIo/Views/Share/ShareCardTemplate10+Content.swift  (title, rule, 2x2 stats, wordmark)
    ios/SportInIo/Views/Share/ShareCardSlot.swift                (flexibleTemplateSize 360x640)
    ios/SportInIo/Utilities/ShareCardDisplayFont.swift           (BigShouldersDisplay-ExtraBold)
    ios/SportInIo/Services/MapboxSnapshotService.swift           (dark-v11 map, #1A8CFF route, start/end dots)
    ios/SportInIo/Utilities/ShareCardHarnessRunFixture.swift     (run data: 5.2 km, 5:58 /km, 31:00, 4.820 steps)
  Canvas: 360 x 640 pt, scaled to the iframe width.
  Map: the real card uses a Mapbox dark-v11 snapshot; here it is a drawn, fictional
  dark street plan ("Riverside Park") with a fictional loop, at the same 50% opacity and masks.
  The app rotates the title line at random; this mock fixes one line from the same pool.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map watermark card</title>
<style>
  @font-face {
    font-family: "BigShouldersDisplay-ExtraBold";
    src: url("assets/card-BigShouldersDisplay-ExtraBold.ttf") format("truetype");
    font-display: block;
  }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #080d1e; }
  :root {
    --blue: rgb(215, 25, 45); /* demo club colour (Northside FC) */
    --title-accent: rgb(199, 199, 199);   /* Color(white: 0.78) */
    --dark-bg: rgb(8, 13, 30);
    --display: "BigShouldersDisplay-ExtraBold", -apple-system, "SF Pro Display", system-ui, sans-serif;
    --text: -apple-system, "SF Pro Text", system-ui, sans-serif;
  }
  #card {
    position: absolute; left: 0; top: 0;
    width: 360px; height: 640px; overflow: hidden;
    transform-origin: 0 0; background: var(--dark-bg);
  }
  .layer { position: absolute; left: 0; top: 0; width: 360px; height: 640px; }
  .photo { object-fit: cover; display: block; }

  /* mapWatermark: top 56% of the card, opacity .5, three masks (radial, horizontal, bottom) */
  .map-zone { position: absolute; left: 0; top: 0; width: 360px; height: 358.4px; }
  .map-zone .m1 {
    width: 100%; height: 100%;
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 70%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 0%, #000 70%, transparent 100%);
  }
  .map-zone .m2 {
    width: 100%; height: 100%;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 14%, #000 86%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0%, #000 14%, #000 86%, transparent 100%);
  }
  .map-zone .m3 {
    width: 100%; height: 100%; opacity: 0.5;
    /* RadialGradient center (0.5, 0.44), endRadius 200: black to 100pt, clear at 188pt */
    -webkit-mask-image: radial-gradient(circle 200px at 180px 157.7px, #000 0px, #000 100px, transparent 188px);
            mask-image: radial-gradient(circle 200px at 180px 157.7px, #000 0px, #000 100px, transparent 188px);
  }
  .map-zone svg { display: block; width: 360px; height: 358.4px; }

  .scrim {
    background: linear-gradient(to bottom,
      rgba(8, 13, 30, 0) 0%, rgba(8, 13, 30, 0) 33.333%,
      rgba(8, 13, 30, 0.5) 66.667%, rgba(8, 13, 30, 0.8) 100%);
  }

  /* content VStack(alignment: .leading, spacing: 0) */
  .content { display: flex; flex-direction: column; align-items: flex-start; }
  .sp-map { flex: none; height: 358.4px; }
  .title {
    flex: none; box-sizing: border-box; width: 360px; padding: 0 26px;
    font-family: var(--display); font-size: 30px; line-height: normal;
    text-transform: uppercase; color: #fff; margin: 0; font-weight: 800;
    text-shadow: 0 0 16px rgba(0, 0, 0, 0.6);
  }
  .title .accent { color: var(--title-accent); }
  .rule {
    flex: none; margin-left: 26px; margin-top: 8.96px;    /* 640 * 0.014 */
    width: 26px; height: 2.5px; border-radius: 1.25px; background: var(--blue);
  }
  .sp-stats { flex: none; height: 32px; }                  /* 640 * 0.05 */
  .stats {
    flex: none; box-sizing: border-box; width: 360px; padding: 0 26px;
    display: grid; grid-template-columns: 1fr 1fr; column-gap: 8px; row-gap: 18px;
  }
  .stat { display: flex; flex-direction: column; gap: 3px; text-shadow: 0 0 6px rgba(0, 0, 0, 0.4); }
  .stat .label {
    font-family: var(--text); font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    line-height: normal; color: rgba(255, 255, 255, 0.68);
  }
  .stat .value {
    font-family: var(--display); font-size: 22px; font-weight: 800; line-height: normal; color: #fff;
  }
  .sp-flex { flex: 1 1 auto; }
  .wordmark-row { flex: none; width: 360px; display: flex; justify-content: center; }
  .wordmark { height: 12.8px; width: auto; display: block; filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.45)); }
  .sp-bottom { flex: none; height: 22.4px; }               /* 640 * 0.035 */
</style>
</head>
<body>
<div id="card">
  <img class="layer photo" src="assets/card-photo-bike.jpg" alt="">

  <div class="map-zone" aria-hidden="true">
    <div class="m1"><div class="m2"><div class="m3">
      <!-- Fictional dark street plan in the Mapbox dark-v11 palette. Not a real place. -->
      <svg viewBox="0 0 360 358.4" xmlns="http://www.w3.org/2000/svg">
        <rect width="360" height="358.4" fill="#232425"/>
        <!-- river -->
        <path d="M-10 250 C 60 228, 110 262, 170 246 S 290 214, 370 236 L 370 286 C 300 266, 240 300, 170 294 S 50 276, -10 300 Z" fill="#131416"/>
        <!-- park -->
        <path d="M70 70 L 286 62 L 300 214 C 250 226, 210 232, 170 238 C 130 242, 96 236, 64 226 Z" fill="#262b27"/>
        <!-- park pond -->
        <ellipse cx="200" cy="150" rx="26" ry="14" fill="#131416"/>
        <!-- minor streets -->
        <g stroke="#2f3133" stroke-width="2" fill="none">
          <path d="M0 30 L 360 22"/><path d="M0 330 L 360 322"/>
          <path d="M30 0 L 22 358"/><path d="M330 0 L 338 358"/>
          <path d="M0 120 L 64 116"/><path d="M300 110 L 360 106"/>
          <path d="M0 190 L 66 188"/><path d="M302 180 L 360 178"/>
          <path d="M120 0 L 116 66"/><path d="M220 0 L 222 64"/>
          <path d="M110 300 L 104 358"/><path d="M250 300 L 256 358"/>
        </g>
        <!-- park paths -->
        <g stroke="#30352f" stroke-width="1.2" fill="none">
          <path d="M90 90 C 140 120, 170 110, 200 136"/><path d="M226 150 C 250 170, 270 180, 290 200"/>
          <path d="M120 222 C 140 190, 150 170, 176 160"/>
        </g>
        <!-- major roads -->
        <g stroke="#3b3d40" stroke-width="3.2" fill="none" stroke-linecap="round">
          <path d="M-10 58 L 370 48"/>
          <path d="M56 -10 L 50 368"/>
          <path d="M306 -10 L 316 368"/>
          <path d="M-10 316 C 120 306, 240 312, 370 300"/>
        </g>
        <!-- bridges -->
        <g stroke="#3b3d40" stroke-width="2.6"><path d="M150 236 L 156 304"/><path d="M262 226 L 268 296"/></g>
        <!-- labels -->
        <g font-family="-apple-system, system-ui, sans-serif" fill="#7b7e82">
          <text x="148" y="196" font-size="7.5" letter-spacing="0.4">Riverside Park</text>
          <text x="186" y="44" font-size="6" letter-spacing="0.3" fill="#6a6d71">Mill Street</text>
          <text x="200" y="272" font-size="6" letter-spacing="0.6" fill="#55585c" font-style="italic">Alder River</text>
        </g>
        <!-- fictional loop route: 2pt #1A8CFF, round caps/joins; green start, red end (r 2) -->
        <path d="M118 210 C 96 180, 90 140, 104 108 C 116 82, 150 76, 184 86 C 222 96, 262 92, 276 120 C 290 148, 270 172, 252 186 C 232 202, 214 206, 190 212 C 166 218, 140 224, 124 214"
              fill="none" stroke="#1a8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="118" cy="210" r="2" fill="#00ff00"/>
        <circle cx="124" cy="214" r="2" fill="#ff0000"/>
      </svg>
    </div></div></div>
  </div>

  <div class="layer scrim"></div>

  <div class="layer content">
    <div class="sp-map"></div>
    <p class="title">Main character <span class="accent">miles.</span></p>
    <div class="rule"></div>
    <div class="sp-stats"></div>
    <div class="stats">
      <div class="stat"><span class="label">DISTANCE</span><span class="value">5.2 km</span></div>
      <div class="stat"><span class="label">PACE</span><span class="value">5:58 /km</span></div>
      <div class="stat"><span class="label">TIME</span><span class="value">31:00</span></div>
      <div class="stat"><span class="label">STEPS</span><span class="value">4.820</span></div>
    </div>
    <div class="sp-flex"></div>
    <div class="wordmark-row"><img class="wordmark" src="assets/demo-northside-fc-wordmark.png" alt="Northside FC, a made-up demo club"></div>
    <div class="sp-bottom"></div>
  </div>
</div>
<script>
  (function () {
    var card = document.getElementById("card");
    function fit() { card.style.transform = "scale(" + (window.innerWidth / 360) + ")"; }
    fit();
    window.addEventListener("resize", fit);
  })();
</script>
</body>
</html>
