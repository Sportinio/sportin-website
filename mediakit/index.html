<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SportIn &middot; Media Kit</title>
<meta name="description" content="Create your personal #10KChallenge poster. Upload your photo, add your name and title, and download it ready to share.">
<meta name="theme-color" content="#0751FB">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<meta property="og:type" content="website">
<meta property="og:site_name" content="SportIn">
<meta property="og:title" content="SportIn &middot; Media Kit">
<meta property="og:description" content="Create your personal #10KChallenge poster and share that you walk 10,000 steps in 24 hours.">
<meta property="og:url" content="https://sportin.io/mediakit">
<meta property="og:image" content="https://sportin.io/mediakit/10k-challenge-bg.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@800&family=Archivo+Black&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06060C;
    --panel: #111119;
    --line: rgba(255,255,255,0.1);
    --text: #FFFFFF;
    --dim: #9AA0B4;
    --accent: #d322b5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Montserrat', -apple-system, sans-serif;
    min-height: 100vh;
    padding: 28px 20px 60px;
  }
  header.page {
    text-align: center;
    max-width: 860px;
    margin: 0 auto 30px;
  }
  header.page h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  header.page p {
    margin-top: 10px;
    font-size: 14px;
    color: var(--dim);
    line-height: 1.6;
  }
  .templates {
    max-width: 860px;
    margin: 0 auto 28px;
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .tpl {
    width: 96px;
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
    color: var(--text);
    text-align: center;
    cursor: pointer;
  }
  .tpl .thumb {
    width: 96px;
    height: 120px;
    border-radius: 10px;
    border: 1px solid var(--line);
    overflow: hidden;
    background: #0a0a12;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tpl .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .tpl .name {
    display: block;
    margin-top: 7px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--dim);
  }
  .tpl.active .thumb {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(211, 34, 181, 0.35);
  }
  .tpl.active .name { color: var(--text); }
  .tpl.soon { cursor: default; opacity: 0.55; }
  .tpl.soon .thumb {
    border-style: dashed;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--dim);
  }
  .studio {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 28px;
    flex-wrap: wrap;
  }
  .poster-wrap {
    flex: 0 1 480px;
    max-width: 480px;
    width: 100%;
  }
  canvas#poster {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 14px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }
  .controls {
    flex: 0 1 340px;
    max-width: 340px;
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .controls h2 {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .controls p.hint {
    font-size: 12px;
    color: var(--dim);
    line-height: 1.5;
  }
  label.field span {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 6px;
  }
  input[type="text"] {
    width: 100%;
    background: #0a0a12;
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 12px;
    outline: none;
  }
  input[type="text"]:focus { border-color: rgba(211,34,181,0.55); }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .btn {
    display: block;
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 13px 14px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    text-align: center;
  }
  .btn.upload {
    background: #1A1A26;
    color: var(--text);
    border: 1px solid var(--line);
  }
  .btn.upload:hover { background: #222234; }
  .btn.download {
    background: linear-gradient(90deg, #3a7bff, #d322b5);
    color: #fff;
  }
  .btn.download:hover { filter: brightness(1.1); }
  input[type="file"] { display: none; }
  .divider { height: 1px; background: var(--line); }
</style>
</head>
<body>

<header class="page">
  <h1>SportIn Media Kit</h1>
  <p>Pick a template, upload your photo, add your name and title, and download your poster ready to share.</p>
</header>

<div class="templates" id="templateStrip" aria-label="Templates"></div>

<div class="studio">
  <div class="poster-wrap">
    <canvas id="poster" width="1080" height="1350"></canvas>
  </div>

  <div class="controls">
    <h2>Customize</h2>
    <p class="hint">Upload a photo with the background removed (PNG with transparency). On iPhone: press and hold your subject in the Photos app, then Copy or Share it as an image.</p>

    <button class="btn upload" id="uploadBtn">Upload photo</button>
    <input type="file" id="photoInput" accept="image/png,image/webp,image/jpeg">

    <label class="field">
      <span>Photo size</span>
      <input type="range" id="photoScale" min="50" max="160" value="100">
    </label>
    <label class="field">
      <span>Photo position</span>
      <input type="range" id="photoY" min="-200" max="200" value="0">
    </label>

    <div class="divider"></div>

    <label class="field">
      <span>Name</span>
      <input type="text" id="nameInput" value="YOUR NAME" maxlength="26">
    </label>
    <label class="field">
      <span>Title</span>
      <input type="text" id="titleInput" value="YOUR TITLE" maxlength="30">
    </label>

    <div class="divider"></div>

    <button class="btn download" id="downloadBtn">Download PNG</button>
  </div>
</div>

  // Template registry. Each future template gets an entry here plus its own
  // draw function dispatched from render(). Entries with ready:false render

    { id: '10k-challenge', name: '10K Challenge', ready: true, thumb: '/mediakit/10k-challenge-bg.jpg' },
    { id: 'template-2', name: 'Coming soon', ready: false },

  var state = {
    template: TEMPLATES[0],

    photoScale: 1.0,
    photoY: 0,
    name: 'YOUR NAME',
    title: 'YOUR TITLE'
  };

  function buildTemplateStrip() {
    var strip = document.getElementById('templateStrip');
    TEMPLATES.forEach(function (tpl) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tpl' + (tpl.ready ? '' : ' soon') + (tpl === state.template ? ' active' : '');
      var thumb = document.createElement('span');
      thumb.className = 'thumb';
      if (tpl.ready && tpl.thumb) {
        var img = document.createElement('img');
        img.src = tpl.thumb;
        img.alt = tpl.name;
        thumb.appendChild(img);
      } else {
        thumb.textContent = 'Soon';
      }
      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = tpl.name;
      btn.appendChild(thumb);
      btn.appendChild(name);
      if (tpl.ready) {
        btn.addEventListener('click', function () {
          state.template = tpl;
          var nodes = strip.querySelectorAll('.tpl');
          for (var i = 0; i < nodes.length; i++) nodes[i].classList.remove('active');
          btn.classList.add('active');
          render();
        });
      } else {
        btn.disabled = true;
        btn.setAttribute('aria-disabled', 'true');
      }
      strip.appendChild(btn);
    });
  }

  var logo = new Image();
  logo.src = LOGO_SRC;

  // The approved campaign background (ring, glow, number, and logo baked in).
  // When it loads, the procedural ring/number/logo layers are skipped entirely.
  // The poster is fully canvas-rendered. The campaign JPEG remains only as
  // the template thumbnail and og:image; drawing the scene in code lets the
  // number sit exactly at the ring's center, which the baked art could not.

  // ---------- text helpers (manual letter spacing: identical on every browser) ----------

  function spacedWidth(c, text, spacing) {
    var w = 0;
    for (var i = 0; i < text.length; i++) {
      w += c.measureText(text[i]).width;
      if (i < text.length - 1) w += spacing;
    }
    return w;
  }

  function drawSpacedCentered(c, text, cx, y, spacing) {
    var total = spacedWidth(c, text, spacing);
    var x = cx - total / 2;
    for (var i = 0; i < text.length; i++) {
      c.fillText(text[i], x, y);
      x += c.measureText(text[i]).width + spacing;
    }
  }

  // Shrinks the font size until the text (with spacing) fits maxWidth.
  function fitFont(c, text, weight, family, startSize, spacing, maxWidth) {
    var size = startSize;
    c.font = weight + ' ' + size + 'px ' + family;
    var w = spacedWidth(c, text, spacing);
    if (w > maxWidth) {
      size = Math.floor(size * maxWidth / w);
      c.font = weight + ' ' + size + 'px ' + family;
    }
    return size;
  }

  // ---------- layers ----------

  function drawBackground() {
    ctx.fillStyle = '#06070b';
    ctx.fillRect(0, 0, W, H);

    // Smoky ambient blooms inside the ring, matching the campaign art:
    // cool blue on the left, magenta pooling lower right.
    var g1 = ctx.createRadialGradient(400, 620, 60, 400, 620, 560);
    g1.addColorStop(0, 'rgba(43, 84, 190, 0.34)');
    g1.addColorStop(1, 'rgba(43, 84, 190, 0)');
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, W, H);

    var g2 = ctx.createRadialGradient(760, 800, 60, 760, 800, 560);
    g2.addColorStop(0, 'rgba(180, 34, 160, 0.30)');
    g2.addColorStop(1, 'rgba(180, 34, 160, 0)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, W, H);

    var v = ctx.createRadialGradient(W / 2, H * 0.45, H * 0.30, W / 2, H * 0.45, H * 0.85);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  var RING = { cx: 540, cy: 553, r: 408 };

  function ringGradient(c) {
    var g = c.createLinearGradient(RING.cx - RING.r, RING.cy, RING.cx + RING.r, RING.cy);
    g.addColorStop(0, '#3a7bff');
    g.addColorStop(0.45, '#6f63f0');
    g.addColorStop(1, '#ff4fd8');
    return g;
  }

  // The ring is built once offscreen: a full circle whose top melts away with
  // a gradient-transparency mask around the logo, so the neon line blends out
  // instead of hard-stopping against a dark patch.
  var ringCache = null;
  function ringLayer() {
    if (ringCache) return ringCache;
    var c = document.createElement('canvas');
    c.width = W;
    c.height = H;
    var r = c.getContext('2d');
    r.strokeStyle = ringGradient(r);
    r.lineWidth = 9;
    r.shadowColor = 'rgba(120, 110, 255, 0.85)';
    r.shadowBlur = 48;
    r.beginPath();
    r.arc(RING.cx, RING.cy, RING.r, 0, Math.PI * 2);
    r.stroke();
    // second pass tightens the core line
    r.shadowBlur = 18;
    r.stroke();

    // gradient fade centered on the logo: fully clear under the icon,
    // easing back to full ring strength further along the arc
    r.globalCompositeOperation = 'destination-out';
    var fade = r.createRadialGradient(RING.cx, RING.cy - RING.r, 0, RING.cx, RING.cy - RING.r, 160);
    fade.addColorStop(0, 'rgba(0, 0, 0, 1)');
    fade.addColorStop(0.5, 'rgba(0, 0, 0, 0.95)');
    fade.addColorStop(1, 'rgba(0, 0, 0, 0)');
    r.fillStyle = fade;
    r.fillRect(0, 0, W, H);

    ringCache = c;
    return c;
  }

  function drawRing() {
    ctx.drawImage(ringLayer(), 0, 0);
  }

  function drawBigNumber() {
    var text = '10,000';   // matches the approved campaign artwork
    var num = document.createElement('canvas');
    num.width = W;
    num.height = H;
    var n = num.getContext('2d');
    n.textBaseline = 'middle';
    n.textAlign = 'left';
    var spacing = -4;
    fitFont(n, text, '800', "'Saira Extra Condensed', sans-serif", 700, spacing, 1005);

    // base: cool white on the blue side warming to pink on the right
    var g = n.createLinearGradient(40, 0, W - 40, 0);
    g.addColorStop(0, '#a9bce4');
    g.addColorStop(0.32, '#eef2fb');
    g.addColorStop(0.62, '#f6e3f3');
    g.addColorStop(1, '#ea99d8');
    n.fillStyle = g;
    // Centered exactly on the ring's midpoint.
    drawSpacedCentered(n, text, W / 2, RING.cy, spacing);

    // frozen surface: grain trapped inside the digits only
    n.globalCompositeOperation = 'source-atop';
    n.globalAlpha = 0.16;
    var t = grainTile();
    for (var gy = 0; gy < H; gy += 256) {
      for (var gx = 0; gx < W; gx += 256) {
        n.drawImage(t, gx, gy);
      }
    }
    n.globalAlpha = 1;

    // sheen: lit from above, falling into shade at the base
    var sheen = n.createLinearGradient(0, 220, 0, 800);
    sheen.addColorStop(0, 'rgba(255, 255, 255, 0.30)');
    sheen.addColorStop(0.5, 'rgba(255, 255, 255, 0)');
    sheen.addColorStop(1, 'rgba(10, 10, 20, 0.30)');
    n.fillStyle = sheen;
    n.fillRect(0, 0, W, H);

    // the ring's neon reflecting off the digit faces
    var lb = n.createRadialGradient(190, 640, 60, 190, 640, 460);
    lb.addColorStop(0, 'rgba(64, 130, 255, 0.34)');
    lb.addColorStop(1, 'rgba(64, 130, 255, 0)');
    n.fillStyle = lb;
    n.fillRect(0, 0, W, H);
    var rp = n.createRadialGradient(890, 640, 60, 890, 640, 460);
    rp.addColorStop(0, 'rgba(255, 79, 216, 0.34)');
    rp.addColorStop(1, 'rgba(255, 79, 216, 0)');
    n.fillStyle = rp;
    n.fillRect(0, 0, W, H);
    n.globalCompositeOperation = 'source-over';

    // pass 1: soft light bloom around the digits
    ctx.save();
    ctx.shadowColor = 'rgba(190, 205, 255, 0.30)';
    ctx.shadowBlur = 56;
    ctx.drawImage(num, 0, 0);
    // pass 2: the dark drop shadow that lifts the number off the background
    ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
    ctx.shadowBlur = 26;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 14;
    ctx.drawImage(num, 0, 0);
    ctx.restore();
  }

  // Color spill masked to the subject's alpha, cached per image and size so
  // slider drags do not rebuild it every frame.
  var spillCache = { img: null, w: 0, h: 0, canvas: null };
  function spillFor(img, w, h) {
    if (spillCache.img === img && spillCache.w === w && spillCache.h === h) {
      return spillCache.canvas;
    }
    var c = document.createElement('canvas');
    c.width = Math.max(1, w);
    c.height = Math.max(1, h);
    var g = c.getContext('2d');
    var grad = g.createLinearGradient(0, 0, c.width, 0);
    grad.addColorStop(0, 'rgba(64, 130, 255, 0.6)');
    grad.addColorStop(0.3, 'rgba(64, 130, 255, 0)');
    grad.addColorStop(0.7, 'rgba(255, 79, 216, 0)');
    grad.addColorStop(1, 'rgba(255, 79, 216, 0.6)');
    g.fillStyle = grad;
    g.fillRect(0, 0, c.width, c.height);
    g.globalCompositeOperation = 'destination-in';
    g.drawImage(img, 0, 0, c.width, c.height);
    spillCache = { img: img, w: w, h: h, canvas: c };
    return c;
  }

  function drawPhoto() {
    // No stand-in figure: the poster stays clean until a photo is uploaded.
    if (!state.photo) return;
    var img = state.photo;
    var baseH = 900 * state.photoScale;
    var s = baseH / img.height;
    var dw = img.width * s, dh = baseH;
    var x = (W - dw) / 2;
    var bottom = 1350 + state.photoY;   // anchored to the poster bottom, slider shifts it
    var y = bottom - dh;

    // 1) Grounding shadow behind the torso seats the subject in the scene.
    var gs = ctx.createRadialGradient(540, y + dh * 0.72, 40, 540, y + dh * 0.72, dw * 0.62);
    gs.addColorStop(0, 'rgba(0, 0, 0, 0.5)');
    gs.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = gs;
    ctx.fillRect(0, 0, W, H);

    // 2) Neon rim light. The image is drawn far off-canvas and only its offset
    // shadow lands on the poster: a colored silhouette hugging each edge.
    ctx.save();
    ctx.shadowBlur = 34;
    ctx.shadowOffsetY = 0;
    ctx.shadowColor = 'rgba(64, 130, 255, 0.55)';
    ctx.shadowOffsetX = 10000 - 15;
    ctx.drawImage(img, x - 10000, y, dw, dh);
    ctx.shadowColor = 'rgba(255, 79, 216, 0.55)';
    ctx.shadowOffsetX = 10000 + 15;
    ctx.drawImage(img, x - 10000, y, dw, dh);
    ctx.restore();

    // 3) The subject, graded slightly toward the artwork's light, with a soft
    // cast shadow that falls down and away.
    ctx.save();
    ctx.filter = 'saturate(1.06) contrast(1.05) brightness(0.97)';
    ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
    ctx.shadowBlur = 48;
    ctx.shadowOffsetY = 14;
    ctx.drawImage(img, x, y, dw, dh);
    ctx.restore();

    // 4) The ring's blue and magenta catch the subject's edges.
    ctx.save();
    ctx.globalAlpha = 0.45;
    ctx.drawImage(spillFor(img, Math.round(dw), Math.round(dh)), x, y);
    ctx.restore();
  }

  var grainCache = null;
  function grainTile() {
    if (grainCache) return grainCache;
    var c = document.createElement('canvas');
    c.width = 256;
    c.height = 256;
    var g = c.getContext('2d');
    var d = g.createImageData(256, 256);
    for (var i = 0; i < d.data.length; i += 4) {
      // mid-gray is neutral under the overlay blend, so grain never shifts tone
      var v = 128 + Math.round(Math.random() * 26 - 13);
      d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
      d.data[i + 3] = 255;
    }
    g.putImageData(d, 0, 0);
    grainCache = c;
    return c;
  }

  function drawFinish() {
    // Gentle vignette pulls the eye to the subject.
    var v = ctx.createRadialGradient(W / 2, H * 0.46, H * 0.35, W / 2, H * 0.46, H * 0.92);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.3)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);

    // Film grain unifies the uploaded photo with the artwork.
    ctx.save();
    ctx.globalAlpha = 0.05;
    ctx.globalCompositeOperation = 'overlay';
    var t = grainTile();
    for (var gy = 0; gy < H; gy += 256) {
      for (var gx = 0; gx < W; gx += 256) {
        ctx.drawImage(t, gx, gy);
      }
    }
    ctx.restore();
  }

  function drawBottomOverlay() {
    // Reaches up past the #10KCHALLENGE headline with an eased falloff, so
    // the whole text block sits on dark instead of fighting the photo.
    var g = ctx.createLinearGradient(0, 720, 0, H);
    g.addColorStop(0, 'rgba(4, 5, 8, 0)');
    g.addColorStop(0.28, 'rgba(4, 5, 8, 0.32)');
    g.addColorStop(0.52, 'rgba(4, 5, 8, 0.62)');
    g.addColorStop(0.75, 'rgba(4, 5, 8, 0.85)');
    g.addColorStop(1, 'rgba(4, 5, 8, 0.97)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 700, W, H - 700);
  }

  function drawHeadline() {
    var text = '#10KCHALLENGE';
    ctx.save();
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    var spacing = 2;
    fitFont(ctx, text, '400', "'Archivo Black', sans-serif", 118, spacing, 990);

    var g = ctx.createLinearGradient(60, 0, W - 60, 0);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.82, '#ffffff');
    g.addColorStop(1, '#f6d7ee');
    ctx.fillStyle = g;
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 24;
    drawSpacedCentered(ctx, text, W / 2, 1012, spacing);
    ctx.restore();
  }

  function drawStatement() {
    var text = 'I’ve accepted the #10KChallenge to walk 10,000 steps in 24 hours and highlight the importance of everyday movement.';
    ctx.save();
    ctx.font = "600 25px 'Montserrat', sans-serif";
    ctx.fillStyle = '#c3c8d3';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.55)';
    ctx.shadowBlur = 12;

    // simple centered word wrap
    var words = text.split(' ');
    var lines = [];
    var line = '';
    var maxWidth = 640;
    for (var i = 0; i < words.length; i++) {
      var probe = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(probe).width > maxWidth && line) {
        lines.push(line);
        line = words[i];
      } else {
        line = probe;
      }
    }
    if (line) lines.push(line);

    var lineHeight = 37;
    var y = 1078;
    for (var j = 0; j < lines.length; j++) {
      ctx.fillText(lines[j], W / 2, y);
      y += lineHeight;
    }
    ctx.restore();
  }

  function drawLogo() {
    if (!logo.complete || logo.naturalWidth === 0) return;
    // The icon floats where the ring fades out, grounded by its own dark
    // shadow instead of a painted background.
    var cx = RING.cx, cy = RING.cy - RING.r;
    var h = 56;
    var w = h * (logo.naturalWidth / logo.naturalHeight);
    ctx.save();
    // wide soft shadow seats the icon in the scene
    ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
    ctx.shadowBlur = 34;
    ctx.shadowOffsetY = 8;
    ctx.drawImage(logo, cx - w / 2, cy - h / 2, w, h);
    // tight pass keeps the mark crisp
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 3;
    ctx.drawImage(logo, cx - w / 2, cy - h / 2, w, h);
    ctx.restore();
  }

  function drawSignature() {
    ctx.save();
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';

    // magenta divider above the name
    var lineW = 180, lineY = 1198;
    var g = ctx.createLinearGradient(W / 2 - lineW / 2, 0, W / 2 + lineW / 2, 0);
    g.addColorStop(0, 'rgba(211, 34, 181, 0)');
    g.addColorStop(0.5, '#d322b5');
    g.addColorStop(1, 'rgba(211, 34, 181, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(W / 2 - lineW / 2, lineY, lineW, 3);

    var name = (state.name || '').trim().toUpperCase();
    if (name) {
      ctx.font = "800 31px 'Montserrat', sans-serif";
      ctx.fillStyle = '#ffffff';
      drawSpacedCentered(ctx, name, W / 2, 1244, 9);
    }

    var title = (state.title || '').trim().toUpperCase();
    if (title) {
      ctx.font = "600 17px 'Montserrat', sans-serif";
      ctx.fillStyle = '#8e93a1';
      drawSpacedCentered(ctx, title, W / 2, 1284, 7);
    }
    ctx.restore();
  }

  // The 10K Challenge template. Future templates get their own render
  // function and a dispatch branch below.
  function renderTemplate10k() {
    drawBackground();
    drawRing();
    drawBigNumber();
    drawPhoto();
    drawBottomOverlay();
    drawHeadline();
    drawStatement();
    drawLogo();
    drawSignature();
    drawFinish();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    if (state.template.id === '10k-challenge') renderTemplate10k();
  }

  // ---------- wiring ----------

  function loadImageFile(file, done) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () { done(img); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  document.getElementById('uploadBtn').addEventListener('click', function () {
    document.getElementById('photoInput').click();
  });
  document.getElementById('photoInput').addEventListener('change', function (e) {
    if (!e.target.files[0]) return;
    loadImageFile(e.target.files[0], function (img) { state.photo = img; render(); });
  });

  document.getElementById('photoScale').addEventListener('input', function (e) {
    state.photoScale = Number(e.target.value) / 100;
    render();
  });
  document.getElementById('photoY').addEventListener('input', function (e) {
    state.photoY = Number(e.target.value);
    render();
  });
  document.getElementById('nameInput').addEventListener('input', function (e) {
    state.name = e.target.value;
    render();
  });
  document.getElementById('titleInput').addEventListener('input', function (e) {
    state.title = e.target.value;
    render();
  });

  document.getElementById('downloadBtn').addEventListener('click', function () {
    canvas.toBlob(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '10k-challenge.png';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
    }, 'image/png');
  });

  // Test hook used only by automated review; harmless in production.
  window.__setTestPhoto = function (dataURL) {
    var img = new Image();
    img.onload = function () { state.photo = img; render(); };
    img.src = dataURL;
  };

  // First paint after the display fonts are really available.
  buildTemplateStrip();
  render();
  if (document.fonts && document.fonts.ready) {
    Promise.all([
      document.fonts.load("800 340px 'Saira Extra Condensed'"),
      document.fonts.load("400 118px 'Archivo Black'"),
      document.fonts.load("800 31px 'Montserrat'"),
      document.fonts.load("600 17px 'Montserrat'")
    ]).then(render).catch(render);
    document.fonts.ready.then(render);
  }
  logo.onload = render;
})();
</script>
</body>
</html>
