<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Dark background -->
  <rect width="200" height="200" rx="24" fill="#1a1a1a"/>
  <!-- Sound wave dots -->
  <!-- Left wave -->
  <circle cx="52" cy="68" r="5" fill="#fff"/><circle cx="52" cy="56" r="5" fill="#fff"/><circle cx="52" cy="44" r="5" fill="#fff"/><circle cx="52" cy="32" r="5" fill="#E53935"/>
  <circle cx="40" cy="68" r="4" fill="#fff"/><circle cx="40" cy="58" r="4" fill="#fff"/><circle cx="40" cy="48" r="4" fill="#fff"/>
  <circle cx="64" cy="68" r="4" fill="#fff"/><circle cx="64" cy="58" r="4" fill="#fff"/><circle cx="64" cy="48" r="4" fill="#fff"/>
  <!-- Center wave (tallest) -->
  <circle cx="100" cy="68" r="5" fill="#fff"/><circle cx="100" cy="56" r="5" fill="#fff"/><circle cx="100" cy="44" r="5" fill="#fff"/><circle cx="100" cy="32" r="5" fill="#fff"/><circle cx="100" cy="20" r="5" fill="#E53935"/>
  <circle cx="88" cy="68" r="4" fill="#fff"/><circle cx="88" cy="58" r="4" fill="#fff"/><circle cx="88" cy="48" r="4" fill="#fff"/><circle cx="88" cy="38" r="4" fill="#fff"/>
  <circle cx="112" cy="68" r="4" fill="#fff"/><circle cx="112" cy="58" r="4" fill="#fff"/><circle cx="112" cy="48" r="4" fill="#fff"/><circle cx="112" cy="28" r="4" fill="#fff"/>
  <!-- Right wave -->
  <circle cx="148" cy="68" r="5" fill="#fff"/><circle cx="148" cy="56" r="5" fill="#fff"/><circle cx="148" cy="44" r="5" fill="#fff"/>
  <circle cx="136" cy="68" r="4" fill="#fff"/><circle cx="136" cy="58" r="4" fill="#fff"/>
  <circle cx="160" cy="68" r="4" fill="#fff"/><circle cx="160" cy="58" r="4" fill="#fff"/>
  <!-- Dot row connecting waves -->
  <circle cx="28" cy="78" r="4" fill="#fff"/><circle cx="40" cy="78" r="4" fill="#fff"/><circle cx="52" cy="78" r="4" fill="#fff"/><circle cx="64" cy="78" r="4" fill="#fff"/><circle cx="76" cy="78" r="4" fill="#fff"/><circle cx="88" cy="78" r="4" fill="#fff"/><circle cx="100" cy="78" r="4" fill="#fff"/><circle cx="112" cy="78" r="4" fill="#fff"/><circle cx="124" cy="78" r="4" fill="#fff"/><circle cx="136" cy="78" r="4" fill="#fff"/><circle cx="148" cy="78" r="4" fill="#fff"/><circle cx="160" cy="78" r="4" fill="#fff"/><circle cx="172" cy="78" r="4" fill="#fff"/>
  <!-- URBAN text -->
  <text x="100" y="118" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="42" font-weight="900" fill="#fff" letter-spacing="2">URBAN</text>
  <!-- Underline -->
  <rect x="18" y="126" width="164" height="3" fill="#fff"/>
  <!-- FM text -->
  <text x="170" y="148" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="20" font-weight="900" fill="#E53935">FM</text>
</svg>
