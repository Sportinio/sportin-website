let clockT = 0;
function startClock(){
  clearInterval(clockT);
  const tick = ()=>{
    const now = new Date();
    const end = new Date(now); end.setHours(24,0,0,0);
    let s = Math.max(0,Math.floor((end-now)/1000));
    const hh = String(Math.floor(s/3600)).padStart(2,"0");
    const mm = String(Math.floor(s%3600/60)).padStart(2,"0");
    const ss = String(s%60).padStart(2,"0");
    document.querySelectorAll("[data-clock]").forEach(e=>e.textContent = hh+":"+mm+":"+ss);
  };
  tick(); clockT = setInterval(tick,1000);
}


/* ===========================================================================
   8. Effort lab: six ways to show the weight of a hexagon
   =========================================================================== */
const LB_R = 26;                      /* hexagon radius, in canvas pixels */
let labCells = null;
function labBuild(){
  if(labCells) return labCells;
  const out = [], sq3 = Math.sqrt(3);
  for(let q=-6;q<=6;q++) for(let r=-6;r<=6;r++){
    const x = LB_R*1.5*q, y = LB_R*sq3*(r + q/2);
    const ang = Math.atan2(y,x);
    const edge = LB_R*4.3 * (0.82 + 0.20*Math.sin(ang*3+0.7) + 0.10*Math.cos(ang*2-1.1));
    const d = Math.hypot(x,y);
    if(d > edge) continue;
    const inward = clamp(1 - d/edge, 0, 1);
    const e = clamp(Math.pow(inward,1.2)*0.94 + (fbm(x/70+9,y/70+3,71,3)-0.5)*0.14, 0, 1);
    out.push({x, y, e: 1 + Math.round(e*99), tier: 1 + Math.min(4,Math.floor(e*5)),
              held: hash32("lb"+q+","+r) % 100 < 17});
  }
  labCells = out;
  return out;
}
function lbCtx(id){
  const cv = document.getElementById(id); if(!cv) return null;
  const g = cv.getContext("2d"), W = cv.clientWidth, H = cv.clientHeight;
  if(!W || !H) return null;
  const dpr = Math.min(devicePixelRatio||1,2);
  cv.width = W*dpr; cv.height = H*dpr;
  g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle = "#0A0812"; g.fillRect(0,0,W,H);
  const k = Math.min(W/(LB_R*10.4), H/(LB_R*9.4));
  g.translate(W/2, H/2); g.scale(k,k);
  return g;
}
function lbHex(g,x,y,rr){
  g.beginPath();
  for(let i=0;i<6;i++){ const a=i*TAU/6, X=x+rr*Math.cos(a), Y=y+rr*Math.sin(a); i?g.lineTo(X,Y):g.moveTo(X,Y); }
  g.closePath();
}
function lbBase(g,c,rr){
  lbHex(g,c.x,c.y,rr);
  g.fillStyle = c.held ? "rgba(201,162,75,0.72)" : "rgba(26,24,40,0.92)";
  g.fill();
  g.lineWidth = 2; g.strokeStyle = "rgba(6,5,10,0.8)"; g.stroke();
  g.lineWidth = 1; g.strokeStyle = "rgba(201,162,75,0.34)"; g.stroke();
}


/* ===========================================================================
   8b. Terrain test: what the land under the honeycomb could look like.
   The landscape is generated, not surveyed. An artifact cannot fetch map
   tiles, so this tests the treatment, not the geography.
   =========================================================================== */
const TER_SEED = 91;
function elev(x,y){
  const ridge = Math.pow(1 - Math.abs(fbm(x/78+4, y/78+2, TER_SEED, 4)-0.5)*2, 2);
  const roll  = fbm(x/38, y/38, TER_SEED+9, 4);
  const west  = clamp((-x)/150 + 0.45, 0, 1);        /* mountains to the west */
  return clamp(ridge*0.66*west + roll*0.44 + west*0.16, 0, 1);
}
let terRivers = null, terRoads = null, terTowns = null;
function terBuild(){
  if(terRivers) return;
  const trace = (x,y,steps)=>{
    const pts = [[x,y]];
    for(let i=0;i<steps;i++){
      let bx=0, by=0, best=Infinity;
      for(let a=0;a<12;a++){
        const th = a*TAU/12, nx = x+Math.cos(th)*7, ny = y+Math.sin(th)*7;
        const e = elev(nx,ny) - 0.02*Math.cos(th);
        if(e < best){ best = e; bx = nx; by = ny; }
      }
      x = bx; y = by; pts.push([x,y]);
      if(x > 260 || Math.abs(y) > 220) break;
    }
    return pts;
  };
  terRivers = [trace(-104,-30,64), trace(-84,34,56), trace(-40,-78,46)];
  terTowns  = [{x:-14,y:-2,r:26},{x:64,y:30,r:17},{x:-72,y:52,r:13},{x:30,y:-58,r:14}];
  terRoads = [];
  for(let i=0;i<terTowns.length;i++){
    for(let j=i+1;j<terTowns.length;j++){
      const a = terTowns[i], b = terTowns[j];
      if(Math.hypot(a.x-b.x,a.y-b.y) > 150) continue;
      const pts = [];
      for(let t=0;t<=10;t++){
        const u = t/10;
        pts.push([ a.x+(b.x-a.x)*u + (fbm(u*7+i, j, 33, 2)-0.5)*22,
                   a.y+(b.y-a.y)*u + (fbm(u*7+j, i, 41, 2)-0.5)*22 ]);
      }
      terRoads.push({pts, major:true});
    }
  }
  terTowns.forEach((t,i)=>{
    for(let k=0;k<3;k++){
      const th = (k/3)*TAU + i;
      const pts = [];
      for(let u=0;u<=6;u++){
        const d = u*13;
        pts.push([ t.x+Math.cos(th)*d + (fbm(u+i,k,55,2)-0.5)*16,
                   t.y+Math.sin(th)*d + (fbm(k,u+i,57,2)-0.5)*16 ]);
      }
      terRoads.push({pts, major:false});
    }
  });
}
function terShade(g,W,H,k){
  const img = g.createImageData(W,H), d = img.data;
  for(let sy=0; sy<H; sy++){
    for(let sx=0; sx<W; sx++){
      const x = (sx-W/2)/k, y = (sy-H/2)/k;
      const e  = elev(x,y);
      const ex = elev(x+2,y) - elev(x-2,y);
      const ey = elev(x,y+2) - elev(x,y-2);
      const lit = clamp(0.5 + (ex*0.72 + ey*0.72)*16, 0, 1);
      const base = 14 + e*58;
      const v = base*(0.30 + lit*1.35);
      const i = (sy*W+sx)*4;
      d[i]   = clamp(v*1.06,0,255);
      d[i+1] = clamp(v*0.98,0,255);
      d[i+2] = clamp(v*0.88,0,255);
      d[i+3] = 255;
    }
  }
  g.save(); g.setTransform(1,0,0,1,0,0); g.putImageData(img,0,0); g.restore();
}
function terWater(g){
  terRivers.forEach(r=>{
    g.beginPath();
    r.forEach((pt,i)=> i ? g.lineTo(pt[0],pt[1]) : g.moveTo(pt[0],pt[1]));
    g.lineJoin = "round"; g.lineCap = "round";
    g.lineWidth = 6.5; g.strokeStyle = "rgba(70,110,150,0.34)"; g.stroke();
    g.lineWidth = 2.6; g.strokeStyle = "rgba(150,196,236,0.8)"; g.stroke();
  });
}
function terRoadsDraw(g){
  terRoads.forEach(r=>{
    g.beginPath();
    r.pts.forEach((pt,i)=> i ? g.lineTo(pt[0],pt[1]) : g.moveTo(pt[0],pt[1]));
    g.lineJoin = "round"; g.lineCap = "round";
    g.lineWidth = r.major ? 3.6 : 2.0;
    g.strokeStyle = "rgba(8,6,12,0.55)"; g.stroke();
    g.lineWidth = r.major ? 1.6 : 0.9;
    g.strokeStyle = r.major ? "rgba(226,196,128,0.85)" : "rgba(201,162,75,0.55)";
    g.stroke();
  });
}
function terBuilt(g){
  terTowns.forEach(t=>{
    g.save();
    g.beginPath(); g.arc(t.x,t.y,t.r,0,TAU); g.clip();
    g.strokeStyle = "rgba(233,206,133,0.30)"; g.lineWidth = 0.8;
    g.beginPath();
    for(let i=-14;i<=14;i++){
      g.moveTo(t.x-t.r, t.y + i*4.5 - t.r); g.lineTo(t.x+t.r, t.y + i*4.5 + t.r);
      g.moveTo(t.x-t.r, t.y - i*4.5 + t.r); g.lineTo(t.x+t.r, t.y - i*4.5 - t.r);
    }
    g.stroke(); g.restore();
    g.beginPath(); g.arc(t.x,t.y,t.r,0,TAU);
    g.lineWidth = 1; g.strokeStyle = "rgba(233,206,133,0.35)"; g.stroke();
  });
}
function terHexes(g,cells,rr,alpha){
  cells.forEach(c=>{
    lbHex(g,c.x,c.y,rr);
    if(c.held){
      g.fillStyle = "rgba(201,162,75,"+alpha+")"; g.fill();
    } else if(alpha >= 0.9){
      g.fillStyle = "rgba(26,24,40,0.92)"; g.fill();
    } else {
      g.fillStyle = "rgba(12,10,20,"+(alpha*0.42).toFixed(2)+")"; g.fill();
    }
    g.lineWidth = 1.6; g.strokeStyle = "rgba(150,154,172,0.36)"; g.stroke();
  });
}
function terScale(id){
  const c = document.getElementById(id);
  return {W:c.clientWidth, H:c.clientHeight,
          k: Math.min(c.clientWidth/(LB_R*10.4), c.clientHeight/(LB_R*9.4))};
}
function drawTerrain(){
  terBuild();
  const cells = labBuild(), rr = LB_R*0.99;

  let g = lbCtx("ter1"); if(!g) return;
  terHexes(g,cells,rr,0.95);

  g = lbCtx("ter2");
  terWater(g); terRoadsDraw(g);
  terHexes(g,cells,rr,0.62);

  g = lbCtx("ter3");
  let m = terScale("ter3"); terShade(g,m.W,m.H,m.k);
  terHexes(g,cells,rr,0.6);

  g = lbCtx("ter4");
  m = terScale("ter4"); terShade(g,m.W,m.H,m.k);
  terWater(g); terRoadsDraw(g); terBuilt(g);
  terHexes(g,cells,rr,0.58);
}

function drawLab(){
  const cells = labBuild(), rr = LB_R*0.95;

  /* 1 — hachure */
  let g = lbCtx("lab1");
  if(!g) return;
  cells.forEach(c=>{
    lbBase(g,c,rr);
    const n = Math.round(1 + c.e/100*7);
    g.save(); lbHex(g,c.x,c.y,rr*0.98); g.clip();
    g.strokeStyle = c.held ? "rgba(30,20,4,0.55)" : "rgba(233,206,133,0.42)";
    g.lineWidth = 0.9;
    g.beginPath();
    for(let i=-n;i<=n;i++){
      const o = i*(rr*1.9/(n*2||1));
      g.moveTo(c.x-rr, c.y+o-rr*0.9); g.lineTo(c.x+rr, c.y+o+rr*0.9);
    }
    if(c.e > 55){
      for(let i=-n;i<=n;i++){
        const o = i*(rr*1.9/(n*2||1));
        g.moveTo(c.x-rr, c.y-o+rr*0.9); g.lineTo(c.x+rr, c.y-o-rr*0.9);
      }
    }
    g.stroke(); g.restore();
  });

  /* 2 — contours */
  g = lbCtx("lab2");
  cells.forEach(c=>{
    lbBase(g,c,rr);
    const n = c.tier;
    for(let i=1;i<=n;i++){
      lbHex(g,c.x,c.y,rr*(1 - i*0.155));
      g.lineWidth = 1.1;
      g.strokeStyle = c.held ? "rgba(36,24,4,"+(0.30+i*0.10).toFixed(2)+")"
                             : "rgba(233,206,133,"+(0.22+i*0.13).toFixed(2)+")";
      g.stroke();
    }
  });

  /* 3 — relief */
  g = lbCtx("lab3");
  cells.slice().sort((a,b)=>a.y-b.y).forEach(c=>{
    const lift = c.e/100*7;
    lbHex(g, c.x + lift*0.35, c.y + lift*0.9, rr);
    g.fillStyle = "rgba(4,3,8,0.75)"; g.fill();
    lbHex(g, c.x - lift*0.15, c.y - lift*0.5, rr);
    g.fillStyle = c.held ? "rgba(201,162,75,0.75)" : "rgba(30,27,46,0.96)";
    g.fill();
    g.lineWidth = 1.2;
    g.strokeStyle = "rgba(247,234,192,"+(0.16 + c.e/100*0.5).toFixed(2)+")";
    g.stroke();
  });

  /* 4 — belts */
  g = lbCtx("lab4");
  const BELT = ["Marches","Fields","Roads","Walls","Keep"];
  cells.forEach(c=>{
    lbHex(g,c.x,c.y,rr);
    const t = c.tier;
    g.fillStyle = c.held ? "rgba(201,162,75,"+(0.42+t*0.09).toFixed(2)+")"
                         : "rgba(30,27,46,"+(0.55+t*0.10).toFixed(2)+")";
    g.fill();
    g.lineWidth = 2; g.strokeStyle = "rgba(6,5,10,0.8)"; g.stroke();
    g.lineWidth = 1; g.strokeStyle = "rgba(201,162,75,0.3)"; g.stroke();
  });
  for(let t=1;t<=5;t++){                      /* the ring boundaries, drawn once */
    g.beginPath();
    cells.filter(c=>c.tier===t).forEach(c=>{
      for(let d=0;d<6;d++){
        const nb = cells.find(o=>Math.abs(o.x-(c.x+LB_R*1.5*DIRS[d][0]))<1 &&
                                 Math.abs(o.y-(c.y+LB_R*Math.sqrt(3)*(DIRS[d][1]+DIRS[d][0]/2)))<1);
        if(nb && nb.tier===t) continue;
        const [i1,i2] = DIR_EDGE[d];
        const a1 = i1*TAU/6, a2 = i2*TAU/6;
        g.moveTo(c.x+rr*Math.cos(a1), c.y+rr*Math.sin(a1));
        g.lineTo(c.x+rr*Math.cos(a2), c.y+rr*Math.sin(a2));
      }
    });
    g.lineWidth = 2.2; g.strokeStyle = "rgba(247,234,192,"+(0.18+t*0.12).toFixed(2)+")"; g.stroke();
  }
  g.font = '600 11px Cinzel, serif'; g.textAlign = "center"; g.textBaseline = "middle";
  [[0,0,"Keep"],[0,-LB_R*3.0,"Fields"],[LB_R*3.2,LB_R*1.4,"Marches"]].forEach(([x,y,label])=>{
    g.fillStyle = "rgba(10,8,14,0.8)";
    const w = g.measureText(label).width;
    g.fillRect(x-w/2-6,y-8,w+12,16);
    g.fillStyle = "rgba(247,234,192,0.9)";
    g.fillText(label,x,y);
  });

  /* 5 — notches on the rim */
  g = lbCtx("lab5");
  cells.forEach(c=>{
    lbBase(g,c,rr);
    const n = c.tier;
    for(let i=0;i<n;i++){
      const a = -Math.PI/2 + (i-(n-1)/2)*0.30;
      const x1 = c.x + Math.cos(a)*rr*0.99, y1 = c.y + Math.sin(a)*rr*0.99;
      const x2 = c.x + Math.cos(a)*rr*0.74, y2 = c.y + Math.sin(a)*rr*0.74;
      g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2);
      g.lineWidth = 3.4; g.strokeStyle = c.held ? "rgba(30,20,4,0.8)" : "rgba(247,234,192,0.8)";
      g.stroke();
    }
  });

  /* 6 — ink wash */
  g = lbCtx("lab6");
  cells.forEach(c=>{
    const e = c.e/100;
    lbHex(g,c.x,c.y,rr);
    if(c.held){
      g.fillStyle = "rgba(201,162,75,0.72)"; g.fill();
      g.fillStyle = "rgba(6,5,10,"+(e*0.55).toFixed(2)+")"; g.fill();
    } else {
      g.fillStyle = "rgb("+Math.round(lerp(52,10,e))+","+Math.round(lerp(48,8,e))+","+Math.round(lerp(74,16,e))+")";
      g.fill();
    }
    g.lineWidth = 2; g.strokeStyle = "rgba(6,5,10,0.8)"; g.stroke();
    g.lineWidth = 1;
    g.strokeStyle = "rgba(201,162,75,"+(0.22 + e*0.5).toFixed(2)+")";
    g.stroke();
  });

  drawTerrain();
}
addEventListener("resize", ()=>{ if(current==="lab") drawLab(); });

/* ===========================================================================
   9. Go
   =========================================================================== */
renderCrumb(); renderDetail(); markRoll();
go(views[location.hash.replace("#","")] ? location.hash.replace("#","") : "overture");
})();
</script>
