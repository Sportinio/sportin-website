<style>
  :root{ --brand:#1A8CFF; --brand-deep:#0751FB; --bg1:#11141b; --bg2:#0a0c11;
    --t2:rgba(255,255,255,.5); --t3:rgba(255,255,255,.42); }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{min-height:100dvh;background:#08080a;overflow-x:hidden;
    font-family:'Inter',-apple-system,system-ui,sans-serif;}

  .invite{position:relative;width:100%;max-width:600px;margin:0 auto;min-height:100dvh;overflow:hidden;display:flex;flex-direction:column;}
  .invite .wm{position:absolute;inset:0;width:100%;height:100%}
  .invite .pad{position:relative;min-width:0;display:flex;flex-direction:column;padding:30px clamp(20px,5.5vw,44px) 0;}
  .row{display:flex;align-items:center;justify-content:flex-end;width:100%;min-width:0;margin-bottom:clamp(22px,4vh,40px)}
  .pill{display:inline-flex;align-items:center;gap:9px;padding:8px 15px;border-radius:999px;border:1px solid rgba(255,255,255,.14)}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--brand)}
  .pill span{font-size:11px;font-weight:700;letter-spacing:1.6px;color:#fff}
  .wordmark{height:14px;width:auto}
  .avatar{position:relative;width:clamp(150px,42vw,250px);height:clamp(150px,42vw,250px);margin:clamp(8px,2vh,22px) 0 clamp(14px,3vh,26px)}
  .avatar .ph{position:absolute;inset:0;border-radius:50%;overflow:hidden;
    background:radial-gradient(circle at 50% 38%,#3a3f4a,#23262e);border:1px solid rgba(255,255,255,.08)}
  .avatar .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .name{position:relative;width:100%;min-width:0;margin-top:clamp(8px,2vh,18px);padding-top:clamp(34px,9vw,60px)}
  .name .last{font-family:'Big Shoulders Display';font-weight:800;font-size:clamp(58px,18vw,110px);line-height:.9;letter-spacing:-1px;color:#fff;text-transform:uppercase}
  .name .first{position:absolute;top:clamp(-4px,-0.5vw,0px);left:2px;font-family:'Ms Madi';font-size:clamp(44px,13.6vw,84px);line-height:1;color:var(--brand-deep);z-index:2;text-shadow:0 2px 12px rgba(8,10,16,.5)}
  .name .first.pink{color:#FF5CA8} .name .first.grey{color:#AEB4BE}
  .stats{margin:clamp(24px,5vh,44px) 0 0;width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px;display:flex}
  .stat{flex:1;min-width:0;padding:clamp(16px,3.5vw,24px) 6px;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vw,12px)}
  .stat + .stat{border-left:1px solid rgba(255,255,255,.08)}
  .stat .lbl{font-size:clamp(11px,2.8vw,13px);font-weight:700;letter-spacing:1.4px;color:var(--t3)}
  .stat .val{font-family:'Big Shoulders Display';font-weight:800;font-size:clamp(28px,8.5vw,44px);color:#fff;line-height:1;height:clamp(30px,8.5vw,46px);display:flex;align-items:center}
  .stat .badge-img{height:clamp(30px,8.5vw,46px);display:block}
  .quote{position:relative;margin-top:clamp(22px,3.5vh,34px);padding:8px 0;display:flex;align-items:center;justify-content:center;min-height:62px}
  .quote .qmark{position:absolute;left:50%;transform:translateX(-50%);top:-14px;font-family:Georgia,'Times New Roman',serif;font-size:clamp(100px,25vw,168px);line-height:1;color:rgba(91,168,255,.32);z-index:0}
  .quote .qtxt{position:relative;z-index:1;text-align:center;color:#fff;font-weight:400;font-size:clamp(15px,4.1vw,20px);line-height:1.4;max-width:80%;text-shadow:0 0 30px rgba(26,140,255,.9),0 0 11px rgba(26,140,255,.65)}

  .foot{margin-top:auto;padding:clamp(20px,4vh,34px) clamp(20px,5.5vw,44px) 26px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .cta{position:relative;cursor:pointer;border:none;width:100%;border-radius:16px;
    background:var(--brand-deep);color:#fff;padding:clamp(18px,4.5vw,24px);font-family:inherit;
    display:flex;align-items:center;justify-content:center}
  .cta span{font-size:clamp(15px,4vw,18px);font-weight:700;letter-spacing:1.5px}
  .cta svg{position:absolute;right:clamp(20px,6vw,30px);top:50%;transform:translateY(-50%);width:clamp(20px,6vw,26px);height:auto}
  .stores{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
  .store-row{display:flex;gap:10px;width:100%}
  .store{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;text-decoration:none;
    font-size:13px;font-weight:600}
  .weblink{color:var(--t2);font-size:12px;text-decoration:underline;text-underline-offset:3px}
  .codehint{color:var(--t3);font-size:12px;text-align:center;line-height:1.5}
  .codehint b{color:#fff;font-weight:700;letter-spacing:.5px}
  .tag{text-align:center;font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.28);font-weight:600}
</style>

    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>

  <div class="stores" id="stores" style="display:none">
    <div class="store-row">
      <a class="store" id="appstore" href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M16 1c.1 1.2-.4 2.3-1.1 3.1-.7.8-1.9 1.5-3 1.4-.1-1.2.4-2.4 1.1-3.1C13.7 1.5 15 .9 16 1zm3.6 16.4c-.5 1.2-.8 1.7-1.5 2.8-1 1.5-2.4 3.4-4.1 3.4-1.5 0-1.9-1-3.9-1-2 0-2.5 1-3.9 1-1.7 0-3-1.7-4-3.2-2.8-4.2-3.1-9.2-1.4-11.8 1.2-1.9 3.1-3 4.9-3 1.8 0 2.9 1 4.4 1 1.4 0 2.3-1 4.4-1 1.6 0 3.3.9 4.5 2.4-3.9 2.2-3.3 7.8.1 9.4z"/></svg>App Store</a>
      <a class="store" id="playstore" href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M3.6 1.8c-.3.3-.5.8-.5 1.4v17.6c0 .6.2 1.1.5 1.4l.1.1L14 12.1v-.2L3.7 1.7l-.1.1zm13.8 13.9L14.4 12l3-3 3.6 2c1 .6 1 1.5 0 2.1l-3.6 2.6zm-.6.6L13.7 12 3.7 22c.4.3 1 .4 1.6.1l11.3-6.4zM5.3 1.9c-.6-.3-1.2-.3-1.6.1l10 9.9 2.5-2.5L5.3 1.9z"/></svg>Google Play</a>
    </div>
    <a class="weblink" id="weblink" href="https://try.sportin.io">Or continue on the web →</a>
  </div>

  <div class="codehint" id="codehint" style="display:none"></div>
  <div class="tag">Let&rsquo;s settle this in steps.</div>
    </div>
  </div>

<script>
const SUPABASE_URL='https://yorrcazqfkpqtsziyyqx.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvcnJjYXpxZmtwcXRzeml5eXF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2MTcwNTksImV4cCI6MjA4OTE5MzA1OX0.TpOf5GO8NKxQjT327S4fzWKD9s-NtYJHSv3YQyxvYS8';
const APP_STORE_URL='https://apps.apple.com/us/app/sportin-rise-to-the-challenge/id6762152651';
const PLAY_STORE_URL='https://play.google.com/store/apps/details?id=app.sportin.io';
const WEB_SIGNUP_URL='https://try.sportin.io';

// 1) Parse the code from /ref/<code>
const code=decodeURIComponent((location.pathname.replace(/^\/ref\/?/,'').split('/')[0]||'').trim().toLowerCase());

// 2) Personalize the card from the inviter's public profile (SECURITY DEFINER RPC).
async function loadInviter(){
  if(!code) return;
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_referral_invite_card`,{
      method:'POST',headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,'Content-Type':'application/json'},
      body:JSON.stringify({p_code:code})});
    if(!r.ok) return;
    const d=await r.json(); const p=Array.isArray(d)?d[0]:d; if(!p) return;
    if(p.first_name) document.getElementById('first').textContent=p.first_name;
    if(p.last_name) document.getElementById('last').textContent=p.last_name;
    const g=(p.gender||'').toLowerCase(); const first=document.getElementById('first');
    if(['female','woman','f','girl'].includes(g)) first.className='first pink';
    else if(['male','man','m','boy'].includes(g)) first.className='first';
    else first.className='first grey';
    if(p.avatar_url){const a=document.getElementById('avatar');a.src=p.avatar_url;}
    // LEVEL = the inviter's tier badge (shown on the avatar AND in the LEVEL tile).
    const TIERS=['bronze','silver','gold','platinum','diamond','master'];
    const tier=(p.tier||'').toLowerCase().trim();
    if(TIERS.includes(tier)){
      const tl=document.getElementById('levelImg'); tl.src='/levels/'+tier+'.png'; tl.style.display='block';
      document.getElementById('level').style.display='none';
    }
    if(p.mi!=null) document.getElementById('mi').textContent=(Math.round(p.mi*10)/10);
    if(p.avg_steps!=null) document.getElementById('steps').textContent=fmtK(p.avg_steps);
  }catch(e){/* graceful: generic invite still renders */}
}
function fmtK(n){n=+n||0;return n>=1000?((n/1000>=10?Math.round(n/1000):(Math.round(n/100)/10))+'k'):(''+n);}

// 3) Accept → carry the code (clipboard + localStorage) and route to the right store.
function isiOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent);}
function isAndroid(){return /android/i.test(navigator.userAgent);}
function routeToStore(){
  if(isiOS()){location.href=APP_STORE_URL;}
  else if(isAndroid()){location.href=PLAY_STORE_URL;}
  else{document.getElementById('stores').style.display='flex';}
}
function accept(){
  try{localStorage.setItem('sportin_ref_code',code);}catch(e){}
  // Copy the full tagged URL so the app can detect a referral on the clipboard
  // (vs. arbitrary text) and parse the code from /ref/<code>. CRITICAL: writeText is
  // async — we must let it settle BEFORE navigating to the store, or iOS Safari aborts
  // the write and the app never sees the code. Navigate on resolve, with a 400ms cap so
  // a hung/denied clipboard never strands the user.
  var navigated=false;
  function once(){ if(navigated) return; navigated=true; routeToStore(); }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(location.origin+'/ref/'+code).then(once,once);
      setTimeout(once,400);
    } else { once(); }
  }catch(e){ once(); }
}
function showCodeHint(){
  if(!code) return;
  const el=document.getElementById('codehint');
  el.innerHTML=`Your invite code is <b>${code}</b> — enter it when you create your account so ${document.getElementById('first').textContent} gets the credit.`;
  el.style.display='block';
}
document.getElementById('appstore').href=APP_STORE_URL;
document.getElementById('playstore').href=PLAY_STORE_URL;
document.getElementById('weblink').href=WEB_SIGNUP_URL+(code?('?ref='+encodeURIComponent(code)):'');
document.getElementById('accept').addEventListener('click',accept);
loadInviter();
</script>
</body>
</html>
